name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate openapi.yaml is valid YAML
        run: npm run lint:spec
      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build public and full specs
        run: npm run build
      # dist-internal/openapi.json has every field, x-internal included. Uploaded as a
      # private Actions artifact only — never published to Pages. Requires repo access
      # to download (this repo is private); hand it to Aplifisa manually.
      - name: Upload full spec (private, for Aplifisa)
        uses: actions/upload-artifact@v4
        with:
          name: openapi-full
          path: dist-internal/openapi.json
          retention-days: 90
      # Renders the actual Scalar site (same index.html as production) with Puppeteer,
      # expanding every collapsed sidebar group first — Scalar's "modern" layout mounts
      # nothing for a collapsed group, so a naive print only captures the intro.
      - name: Render public and full spec to PDF
        run: |
          npm run render-pdf -- openapi.yaml openapi-public.pdf
          npm run render-pdf -- dist-internal/openapi.json openapi-full.pdf
      - name: Upload public spec PDF
        uses: actions/upload-artifact@v4
        with:
          name: openapi-public-pdf
          path: openapi-public.pdf
      # Same access restriction as the openapi-full JSON artifact above — x-internal
      # fields included, never published to Pages.
      - name: Upload full spec PDF (private, for Aplifisa)
        uses: actions/upload-artifact@v4
        with:
          name: openapi-full-pdf
          path: openapi-full.pdf
          retention-days: 90
      # Artifacts aren't at a stable public URL — the API token used to fetch them expires
      # with the run, so the comment links to the run's Artifacts section instead of the
      # files directly. Upserts (via the marker) instead of piling up a new comment per push.
      - name: Comment PR with PDF links
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- openapi-pdf-comment -->'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              '**API spec PDFs for this run are ready.**',
              `Download them from the [workflow run](${runUrl})'s Artifacts section:`,
              '- `openapi-public-pdf` — public spec, what ships to the docs site',
              '- `openapi-full-pdf` — full spec including `x-internal` (Aplifisa) fields'
            ].join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            })
            const existing = comments.find((c) => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              })
            }
      # Everything below here is what actually goes public — remove build tooling and
      # the full spec/PDFs from disk first so the Pages artifact can only ever contain
      # the filtered openapi.yaml, regardless of what upload-pages-artifact does or
      # doesn't exclude on its own. Only bundled on push to main — no point producing a
      # Pages artifact that nothing will deploy from a PR run.
      - name: Strip build tooling and internal spec before publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rm -rf node_modules dist-internal *.pdf
      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
