        unitary_amount:
          type: string
        quantity:
          type: number
        vat_percent:
          type: number
        retention_percent:
          type: number
        discount_percent:
          type: number
        kind:
          type: string
        description:
          type: string
    UserResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: users
        attributes:
          type: object
          properties:
