paths:
  # ── Authentication ───────────────────────────────────────────────────────
  /oauth/token:
    post:
      operationId: createAccessToken
      summary: Generate access token
      description: |
        Exchanges API credentials for a Bearer access token using the
        OAuth2 Client Credentials Grant. Use the resulting `access_token`
        as `Authorization: Bearer <access_token>` on all other requests.
      tags: [Authentication]
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, scope]
              properties:
                grant_type:
                  type: string
                  const: client_credentials
                  description: Must be `client_credentials` (REQUIRED).
                scope:
                  type: string
                  const: ecommerce
                  description: >
                    Must always be `ecommerce` (REQUIRED on every token
                    request), even though scopes do not need to be
                    configured manually in your app settings. Omitting it
                    returns `400 invalid_scope`.
            example:
              grant_type: client_credentials
              scope: ecommerce
      responses:
        "200":
          description: Access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    const: Bearer
                  expires_in:
                    type: integer
                    example: 7200
                    description: Token lifetime in seconds.
                  scope:
                    type: string
                    example: ecommerce
                  created_at:
                    type: integer
                    description: Unix timestamp of issuance.
              example:
                access_token: "abc123..."
                token_type: Bearer
                expires_in: 7200
                scope: ecommerce
                created_at: 1719999999
        "400":
          description: >
            Invalid or missing scope/grant_type. Note: the response body's
            `status_code` field is always `401` regardless of this actual
            HTTP status code (see `OAuthErrorResponse`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"
              example:
                error: invalid_scope
                error_description: The requested scope is invalid, unknown, or malformed.
                status_code: 401
        "401":
          description: Missing or invalid client credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"
              example:
                error: invalid_client
                error_description: Client authentication failed.
                status_code: 401

  # ── Users ──────────────────────────────────────────────────────────────
  /users/{id}:
    get:
      operationId: getUser
      summary: Show user
      tags: [Users]
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      responses:
        "200":
          description: User found
          content:
            application/vnd.quipu.v1+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserResource"
              example:
                data:
                  id: "42"
                  type: users
                  attributes:
                    email: user@example.com
                    name: Jane
                    surnames: Doe
                    locale: es
                    sign_up_draft_data: null
                    is_full_admin: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── Contacts ───────────────────────────────────────────────────────────
  /{owner_slug}/contacts:
    get:
      operationId: listContacts
      summary: List contacts
      tags: [Contacts]
      parameters:
        - $ref: "#/components/parameters/OwnerSlug"
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
        - name: filter[kind]
          in: query
          schema:
            type: string
            enum: [client, supplier, employee]
          description: Filter by contact kind
        - name: filter[tax_id]
          in: query
          schema:
            type: string
          description: Filter by tax ID
        - name: filter[country]
          in: query
          schema:
            type: string
          description: Filter by country code (comma-separated for multiple)
        - name: filter[email]
          in: query
          schema:
            type: string
          description: Filter by email address
        - name: filter[q]
          in: query
          schema:
            type: string
          description: Free-text search across contact fields
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, total_paid_income, -total_paid_income, total_unpaid_income, -total_unpaid_income, total_paid_expenses, -total_paid_expenses, total_unpaid_expenses, -total_unpaid_expenses]
          description: Sort field (prefix with `-` for descending)
      responses:
        "200":
          description: Paginated list of contacts
          content:
            application/vnd.quipu.v1+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContactResource"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createContact
      summary: Create contact
      tags: [Contacts]
      parameters:
        - $ref: "#/components/parameters/OwnerSlug"
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/ContentTypeHeader"
      requestBody:
        required: true
        content:
          application/vnd.quipu.v1+json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: "#/components/schemas/ContactWritable"
            example:
              data:
                type: contacts
                attributes:
                  name: Acme Corp
                  tax_id: B12345678
                  email: billing@acme.com
                  country_code: ES
      responses:
        "201":
          description: Contact created
          content:
            application/vnd.quipu.v1+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ContactResource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /{owner_slug}/contacts/{id}:
    get:
      operationId: getContact
      summary: Show contact
      tags: [Contacts]
      parameters:
        - $ref: "#/components/parameters/OwnerSlug"
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Contact found
          content:
            application/vnd.quipu.v1+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ContactResource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: updateContact
      summary: Update contact
      tags: [Contacts]
      parameters:
        - $ref: "#/components/parameters/OwnerSlug"
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/ContentTypeHeader"
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/vnd.quipu.v1+json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: "#/components/schemas/ContactWritable"
      responses:
        "200":
          description: Contact updated
          content:
            application/vnd.quipu.v1+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ContactResource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deleteContact
      summary: Delete contact
      tags: [Contacts]
      parameters:
        - $ref: "#/components/parameters/OwnerSlug"
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Contact deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /{owner_slug}/contacts/bulk:
    x-internal: true
    post:
      operationId: bulkSyncContacts
      summary: Bulk create/sync contacts
      description: >
        Only available for owners with a supported accounting-software integration enabled —
        returns 403 otherwise. (Aplifisa integration only.) Processes every item independently;
        a failure on one item does not affect the others. Maximum 500 items per request. After an
        `initial` sync, the owner's default income/expense/asset accounting categories are
        activated automatically (see `active` on `AccountingCategoryResource`).
      tags: [Contacts]
      parameters:
        - $ref: "#/components/parameters/OwnerSlug"
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/ContentTypeHeader"
      requestBody:
        required: true
        content:
          application/vnd.quipu.v1+json:
            schema:
              type: object
              required: [sync_type, data]
              properties:
                sync_type:
                  type: string
                  enum: [initial, update]
                  description: >
                    `initial` always creates a new contact for each item, even when a contact
                    with the same tax_id already exists (no matching/upsert — safe to call
                    exactly once per client during setup). `update` upserts by tax_id: updates the
                    existing contact with that tax_id (the oldest one, if more than one somehow
                    shares it), or creates it if none exists yet. On `update`, a field already set
                    on the existing contact is left untouched — only blank fields are filled in.
                data:
                  type: array
                  maxItems: 500
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/ContactBulkItem"
              example:
                sync_type: initial
                data:
                  - attributes:
                      name: Acme Corp
                      tax_id: B12345678
                      country_code: ES
                  - attributes:
                      name: Wayne Enterprises
                      tax_id: B87654321
                      country_code: ES
      responses:
        "200":
          description: >
            Per-item results. Returned with 200 even when some items failed — check each item's
            `status`/`errors`.
          content:
            application/vnd.quipu.v1+json:
              schema:
                type: object
                properties:
                  sync_type:
                    type: string
                    enum: [initial, update]
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContactBulkResultItem"
              example:
                sync_type: initial
                results:
                  - tax_id: B12345678
                    id: "101"
                    status: created
                  - tax_id: B87654321
                    id: "102"
                    status: created
        "400":
          description: Malformed request — invalid `sync_type`, missing/empty `data`, or more than 500 items.
          content:
            application/vnd.quipu.v1+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - detail: "data cannot contain more than 500 items"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── Book Entries (read-only) ───────────────────────────────────────────
  /{owner_slug}/book_entries:
    get:
      operationId: listBookEntries
      summary: List all book entries
      description: |
        Returns a paginated list of all book entries including invoices,
        tickets, simplified invoices, additional income, and paysheets.
      tags: [Book Entries]
      parameters:
        - $ref: "#/components/parameters/OwnerSlug"
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/IncludeBookEntry"
        - name: with_detailed_amounts
          in: query
          schema:
            type: boolean
          description: >
            Include the `detailed_amounts` breakdown object in each entry. Presence of the
            parameter is enough — any value (including empty) enables it.
        - name: filter[type]
          in: query
          schema:
            type: string
            enum: [invoices, tickets, paysheets, additional_incomes]
          description: Filter by entry type
        - name: filter[kind]
          in: query
          schema:
            type: string
            enum: [expenses, income]
          description: Filter by kind (expenses or income)
        - name: filter[q]
          in: query
          schema:
            type: string
          description: Free-text search
        - name: filter[period]
          in: query
          schema:
            type: string
          description: Filter by period (e.g. "2024Q1", "2024-01")
        - name: filter[payment_status]
          in: query
          schema:
            type: string
            enum: [paid, unpaid, due, pending]
          description: "Filter by payment status. Note: `unpaid` includes both `pending` and overdue entries."
        - name: filter[contact_id]
          in: query
          schema:
            type: integer
          description: Filter by contact ID
        - name: filter[validation_status]
          in: query
          schema:
            type: string
          description: Filter by validation status
        - name: filter[field_query][field]
          in: query
          schema:
            type: string
          description: Field name for field-level query filter
        - name: filter[field_query][term]
          in: query
          schema:
            type: string
          description: Search term for field-level query filter
        - name: filter[economic_activity_id]
          in: query
          x-internal: true
          schema:
            type: string
          description: >
            Filter by economic activity (epígrafe) ID. Accepts a numeric ID, or the sentinel
            values `none` (only entries with no economic activity assigned) or `any` (only
            entries with some economic activity assigned). Any other non-numeric value returns
            an empty result rather than an error.
            (Aplifisa integration only.)
        - name: filter[economic_activity_epigraph]
          in: query
          x-internal: true
          schema:
            type: string
          description: >
            Filter by economic activity (epígrafe) code, e.g. `399`. Matches entries whose
            assigned economic activity has this epigraph, scoped to the owner's own economic
            activities.
            (Aplifisa integration only.)
        - name: sort
          in: query
          schema:
            type: string
            enum: [number, -number, issue_date, -issue_date, counterpart_name, -counterpart_name, total_amount, -total_amount, total_amount_without_taxes, -total_amount_without_taxes]
          description: Sort field (prefix with `-` for descending)
      responses:
        "200":
          description: Paginated list of book entries
          content:
            application/vnd.quipu.v1+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookEntryResource"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── Invoices ───────────────────────────────────────────────────────────
  /{owner_slug}/invoices:
    get:
      operationId: listInvoices
      summary: List invoices
      tags: [Invoices]
      parameters:
        - $ref: "#/components/parameters/OwnerSlug"
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/IncludeInvoice"
        - name: filter[kind]
          in: query
          schema:
            type: string
            enum: [expenses, income]
          description: Filter by kind (expenses or income)
        - name: filter[q]
          in: query
          schema:
            type: string
          description: Free-text search
        - name: filter[period]
          in: query
          schema:
            type: string
          description: "Filter by period (e.g. \"2024Q1\", \"2024-01\")"
        - name: filter[payment_status]
          in: query
          schema:
            type: string
            enum: [paid, unpaid, due, pending]
          description: "Filter by payment status. Note: `unpaid` includes both `pending` and overdue entries."
        - name: filter[validation_status]
          in: query
          schema:
            type: string
          description: Filter by validation status
        - name: filter[contact_id]
          in: query
          schema:
            type: integer
          description: Filter by contact ID
        - name: filter[field_query][field]
          in: query
          schema:
            type: string
          description: Field name for field-level query filter
        - name: filter[field_query][term]
          in: query
          schema:
            type: string
          description: Search term for field-level query filter
        - name: filter[economic_activity_id]
          in: query
          x-internal: true
          schema:
            type: string
          description: >
            Filter by economic activity (epígrafe) ID. Accepts a numeric ID, or the sentinel
            values `none` (only entries with no economic activity assigned) or `any` (only
            entries with some economic activity assigned). Any other non-numeric value returns
            an empty result rather than an error.
            (Aplifisa integration only.)
        - name: filter[economic_activity_epigraph]
          in: query
          x-internal: true
          schema:
            type: string
          description: >
            Filter by economic activity (epígrafe) code, e.g. `399`. Matches entries whose
            assigned economic activity has this epigraph, scoped to the owner's own economic
            activities.
            (Aplifisa integration only.)
      responses:
        "200":
          description: Paginated list of invoices
          content:
            application/vnd.quipu.v1+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InvoiceResource"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createInvoice
      summary: Create invoice
      tags: [Invoices]
      parameters:
        - $ref: "#/components/parameters/OwnerSlug"
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/ContentTypeHeader"
      requestBody:
        required: true
        content:
          application/vnd.quipu.v1+json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: "#/components/schemas/InvoiceWritable"
            example:
              data:
                type: invoices
                attributes:
                  kind: income
                  issue_date: "2024-03-15"
                  paid_at: "2024-03-20"
                  payment_method: bank_transfer
                  tags: "consulting"
                  notes: March consulting services
                relationships:
                  contact:
                    data:
                      id: "101"
                      type: contacts
                  numeration:
                    data:
                      id: "5"
                      type: numbering_series
                  items:
                    data:
                      - type: items
                        attributes:
                          concept: Consulting services
                          unitary_amount: "1500.00"
                          quantity: 1
                          vat_percent: 21.0
                          retention_percent: 15.0
      responses:
        "201":
          description: Invoice created
          content:
            application/vnd.quipu.v1+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InvoiceResource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /{owner_slug}/invoices/{id}:
    get:
      operationId: getInvoice
      summary: Show invoice
      tags: [Invoices]
      parameters:
        - $ref: "#/components/parameters/OwnerSlug"
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IncludeInvoice"
      responses:
