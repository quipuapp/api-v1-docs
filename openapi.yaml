          nullable: true
        recipient_tax_id:
          type: string
          nullable: true
        recipient_address:
          type: string
          nullable: true
        recipient_phone:
          type: string
          nullable: true
        recipient_town:
          type: string
          nullable: true
        recipient_zip_code:
          type: string
          nullable: true
        recipient_country_code:
          type: string
          nullable: true
        accounting_account_code:
