    SimplifiedInvoiceCreateWritable:
      description: |
        Creation payload. Same fields as `SimplifiedInvoiceWritable`. `kind` is required, and `issue_date` is required for expenses. `issue_date` is optional for income documents, which start as a draft and get their date on finalization. For income documents, `number`/`filing_number` and `issue_date` must be sent together (400 otherwise), except on non-Verifactu accounts that send `issue_date` with a `numeration` series. Income simplified invoices also need a `contact` relationship or a `recipient_name` (422 otherwise).
      allOf:
        - $ref: '#/components/schemas/SimplifiedInvoiceWritable'
        - type: object
          required:
            - attributes
          properties:
            attributes:
              type: object
              required:
                - kind
              if:
                properties:
                  kind:
                    const: expenses
                required:
                  - kind
              then:
                required:
                  - issue_date
    SimplifiedInvoiceWritable:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: simplified_invoices
        attributes:
          type: object
          properties:
            kind:
              type: string
              enum:
                - income
                - expenses
            issue_date:
              type: string
              format: date
            operation_date:
              type:
                - string
                - 'null'
              format: date
              description: |
                Date on which the operation took place (delivery of goods or provision of services). It must be on or before `issue_date`. Optional: on creation it defaults to `issue_date` when not sent (drafts without `issue_date` get it once they are dated), and sending `null` resets it to `issue_date`. On update, leaving it out keeps the current value, even if `issue_date` changes. A date later than `issue_date` returns 422. Only applicable when `kind` is `income` (ignored for expenses). Unlike `issue_date`, it can still be changed once the simplified invoice is finalized, and it is silently ignored once it has been sent to AEAT. Changing it returns 422 once the simplified invoice has been exported to accounting, included in a submitted tax model or locked by the bookkeeper (for users other than the bookkeeper managing the account, locked documents ignore it — see the update endpoint). Credit notes take the operation date of the rectified simplified invoice unless one is sent.
            number:
              type: string
              nullable: true
              description: |
                Invoice number. For outbound (income) invoices this is the internal filing number/reference; for inbound (expense) invoices this is the supplier's own external reference. `complete_number` takes priority over `number` when both are sent.
            complete_number:
              type: string
              nullable: true
              description: |
                Full simplified invoice number including prefix, authoritative when present (overrides `number` if both are sent).
            filing_number:
              type: string
              nullable: true
              description: |
                Legacy per-numeration-series ordinal (a positive integer, sent as a string). Only meaningful together with an explicit numeration series: the final `number` is then derived from the series prefix plus this ordinal. A non-integer value is treated the same as `number`. Distinct from `complete_number`, which replaces `number` itself rather than this series-ordinal role. Kept for backward compatibility with historical/manually-numbered entries; prefer `number` / `complete_number` otherwise. Only accepted on creation — ignored if sent on an update.
            due_dates:
              type: array
              items:
                type: string
                format: date
            paid_at:
              type: string
              format: date
              nullable: true
            payment_method:
              type: string
            tags:
              type: string
              description: Comma-separated list of tag names (e.g. "vip client,important").
            notes:
              type: string
            recipient_name:
              type: string
              description: Recipient (customer) name. Applicable when `kind` is `income` (outbound).
            target_country:
              type: string
              description: Target country code. Applicable when `kind` is `income` (outbound).
