            user_vat_amount:
              type: string
            user_equalization_tax_amount:
              type: string
            user_income_tax_amount:
              type: string
            user_total_amount:
              type: string
            expense_amount:
              type: string
            non_deductible_expense_amount:
              type: string
            income_amount:
              type: string
            input_vat_amount:
              type: string
            non_deductible_input_vat_amount:
              type: string
            non_deductible_assets_vat_amount:
              type: string
            non_computable_input_vat_amount:
              type: string
            output_vat_amount:
              type: string
            input_equalization_tax_amount:
              type: string
            output_equalization_tax_amount:
              type: string
            income_tax_withheld_amount:
              type: string
            income_tax_deducted_amount:
              type: string
            assets_amount:
              type: string
            non_deductible_assets_amount:
              type: string
            disbursements_amount:
              type: string
    BookEntryResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          description: The specific type (invoices, tickets, simplified_invoices, additional_incomes, paysheets)
        attributes:
          allOf:
            - $ref: '#/components/schemas/BookEntryAttributes'
            - type: object
              properties:
                operation_date:
                  type:
                    - string
                    - 'null'
                  format: date
                  description: |
                    Date on which the operation took place (delivery of goods or provision of services). It is always on or before `issue_date`. Falls back to `issue_date` when no operation date has been set, so it is only `null` on drafts that have no `issue_date` yet. Only present on income invoices and income simplified invoices (omitted for expenses, additional incomes and paysheets).
        relationships:
          type: object
          properties:
            items:
              $ref: '#/components/schemas/RelationshipLinkageArray'
            contact:
              $ref: '#/components/schemas/RelationshipLinkage'
            accounting_category:
              $ref: '#/components/schemas/RelationshipLinkage'
            accounting_subcategory:
              $ref: '#/components/schemas/RelationshipLinkage'
            amending_invoices:
              allOf:
                - $ref: '#/components/schemas/RelationshipLinkageArray'
              description: Invoices that rectify this one. Only present on invoices.
            amended_invoice:
              allOf:
                - $ref: '#/components/schemas/RelationshipLinkage'
              description: The invoice this one rectifies (`type` `invoices`). Only present on invoices.
            amending_tickets:
              allOf:
                - $ref: '#/components/schemas/RelationshipLinkageArray'
              description: Tickets that rectify this one. Only present on tickets.
            amended_ticket:
              allOf:
                - $ref: '#/components/schemas/RelationshipLinkage'
              description: |
                The ticket this one rectifies (`type` `tickets`, simplified invoices included). Only present on tickets.
    TicketAttributes:
      allOf:
        - $ref: '#/components/schemas/BookEntryAttributes'
        - type: object
          properties:
            kind:
              type: string
              enum:
                - income
                - expenses
            total_amount_without_taxes:
              type: string
            vat_amount:
              type: string
            retention_amount:
              type: string
            notes:
              type: string
              nullable: true
            operation_date:
              type:
                - string
                - 'null'
              format: date
              description: |
                Date on which the operation took place (delivery of goods or provision of services). It is always on or before `issue_date`. Falls back to `issue_date` when no operation date has been set, so it is only `null` on drafts that have no `issue_date` yet. Only present on income tickets (omitted for expense tickets and additional incomes).
            download_pdf_url:
              type: string
              format: uri
              nullable: true
              description: Only present on income tickets.
            ephemeral_open_download_pdf_url:
              type: string
              format: uri
              nullable: true
              description: Only present on income tickets.
    TicketResource:
      type: object
      description: |
        A ticket (simplified invoices included) as embedded in the `included` array, e.g. the rectified document sideloaded through `amended_ticket` on `book_entries` or `amended_simplified_invoice` on `simplified_invoices`.
      properties:
        id:
          type: string
        type:
          type: string
          const: tickets
        attributes:
          $ref: '#/components/schemas/TicketAttributes'
        relationships:
          type: object
          properties:
            numeration:
              $ref: '#/components/schemas/RelationshipLinkage'
            items:
              $ref: '#/components/schemas/RelationshipLinkageArray'
            accounting_category:
              $ref: '#/components/schemas/RelationshipLinkage'
            accounting_subcategory:
              $ref: '#/components/schemas/RelationshipLinkage'
            amending_tickets:
              $ref: '#/components/schemas/RelationshipLinkageArray'
            amended_ticket:
              $ref: '#/components/schemas/RelationshipLinkage'
    InvoiceAttributes:
      allOf:
        - $ref: '#/components/schemas/BookEntryAttributes'
        - type: object
          properties:
            kind:
              type: string
              enum:
                - income
                - expenses
            total_amount_without_taxes:
              type: string
            vat_amount:
              type: string
            retention_amount:
              type: string
            last_sent_at:
              type: string
              format: date-time
              nullable: true
              description: |
                ISO 8601 date-time of the last time the invoice was sent. Note that on create/update this field is sent as a Unix timestamp in seconds.
            notes:
              type: string
              nullable: true
            operation_date:
              type:
                - string
                - 'null'
              format: date
              description: |
                Date on which the operation took place (delivery of goods or provision of services). It is always on or before `issue_date`. Falls back to `issue_date` when no operation date has been set, so it is only `null` on drafts that have no `issue_date` yet. Only present when `kind` is `income` (omitted for expenses).
            stage:
              type: string
              enum:
                - noop
                - draft
                - final
                - sent_aeat
                - approved_with_errors_aeat
                - approved_aeat
                - rejected_aeat
              description: Verifactu stage. Only present when `kind` is `income` (omitted for expenses).
            concepts:
              type: array
              items:
                type: string
              description: |
                Distinct line item concepts on this invoice, in item order. Derived from the invoice's items and kept in sync automatically — not directly writable.
            download_pdf_url:
              type: string
              format: uri
              nullable: true
              description: Only present when `kind` is `income` (omitted for expenses).
            ephemeral_open_download_pdf_url:
              type: string
              format: uri
              nullable: true
              description: Only present when `kind` is `income` (omitted for expenses).
    InvoiceResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: invoices
        attributes:
          $ref: '#/components/schemas/InvoiceAttributes'
        relationships:
          type: object
          properties:
            contact:
              $ref: '#/components/schemas/RelationshipLinkage'
            numeration:
              $ref: '#/components/schemas/RelationshipLinkage'
            items:
              $ref: '#/components/schemas/RelationshipLinkageArray'
            accounting_category:
              $ref: '#/components/schemas/RelationshipLinkage'
            accounting_subcategory:
              $ref: '#/components/schemas/RelationshipLinkage'
            amending_invoices:
              $ref: '#/components/schemas/RelationshipLinkageArray'
            amended_invoice:
              $ref: '#/components/schemas/RelationshipLinkage'
    InvoiceCreateWritable:
      description: |
        Creation payload. Same fields as `InvoiceWritable`. `kind` is required, and `issue_date` is required for expenses. `issue_date` is optional for income documents, which start as a draft and get their date on finalization. For income documents, `number`/`filing_number` and `issue_date` must be sent together (400 otherwise), except on non-Verifactu accounts that send `issue_date` with a `numeration` series.
      allOf:
        - $ref: '#/components/schemas/InvoiceWritable'
        - type: object
          required:
            - attributes
          properties:
            attributes:
              type: object
              required:
                - kind
              if:
                properties:
                  kind:
                    const: expenses
                required:
                  - kind
              then:
                required:
                  - issue_date
    InvoiceWritable:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: invoices
        attributes:
          type: object
          properties:
            kind:
              type: string
              enum:
                - income
                - expenses
              description: Whether this is an income or expense invoice (REQUIRED)
            issue_date:
              type: string
              format: date
              description: Issue date (REQUIRED)
            operation_date:
              type:
                - string
                - 'null'
              format: date
              description: |
                Date on which the operation took place (delivery of goods or provision of services). It must be on or before `issue_date`. Optional: on creation it defaults to `issue_date` when not sent (drafts without `issue_date` get it once they are dated), and sending `null` resets it to `issue_date`. On update, leaving it out keeps the current value, even if `issue_date` changes. A date later than `issue_date` returns 422. Only applicable when `kind` is `income` (ignored for expenses). Unlike `issue_date`, it can still be changed once the invoice is finalized, and it is silently ignored once it has been sent to AEAT. Changing it returns 422 once the invoice has been exported to accounting, included in a submitted tax model or locked by the bookkeeper (for users other than the bookkeeper managing the account, locked documents ignore it — see the update endpoint). Credit notes take the operation date of the rectified invoice unless one is sent. For an invoice to an intracommunity contact (EU, outside Spain) it is required: omitting it or sending `null` returns 422, unless the account is managed by the API user or belongs to a bookkeeper.
            number:
              type: string
              nullable: true
              description: |
                Invoice number. For outbound (income) invoices this is the internal filing number/reference; for inbound (expense) invoices this is the supplier's own external reference. `complete_number` takes priority over `number` when both are sent.
            complete_number:
              type: string
              nullable: true
              description: |
                Full invoice number including prefix (e.g. "INV-2024-001"), authoritative when present. For outbound invoices, sets the invoice's internal number directly (overriding `number` if both are sent). For inbound invoices, sets the internal number while `number` is stored as the supplier's external reference.
            filing_number:
              type: string
              nullable: true
              description: |
                Legacy per-numeration-series ordinal (a positive integer, sent as a string). Only meaningful together with an explicit numeration series: the final `number` is then derived from the series prefix plus this ordinal. A non-integer value is treated the same as `number`. Distinct from `complete_number`, which replaces `number` itself rather than this series-ordinal role. Kept for backward compatibility with historical/manually-numbered entries; prefer `number` / `complete_number` otherwise. Only accepted on creation — ignored if sent on an update.
            due_dates:
              type: array
              items:
                type: string
                format: date
            due_date_intervals:
              type: array
              items:
                type: integer
              description: Due date intervals in days from issue date
            paid_at:
              type: string
              format: date
              nullable: true
            payment_method:
              type: string
            tags:
              type: string
              description: Comma-separated list of tag names (e.g. "vip client,important").
            notes:
              type: string
            last_sent_at:
              type:
                - integer
                - 'null'
              example: 1457364458
              description: |
                Unix timestamp in seconds of the last time the invoice was sent. Responses return this field as an ISO 8601 date-time string.
            equivalence_surcharge:
              type: boolean
              description: Whether equivalence surcharge applies
            credit_note_reason:
              type: string
              enum:
                - R1
                - R2
                - R3
                - R4
                - R5
                - R6
                - R7
                - R8
              description: Reason code for credit notes
            exempt_reason:
              type: string
              enum:
                - R1
                - R2
                - R3
              description: Reason code for VAT exemption
            collection_type:
              type: string
              enum:
                - R1
                - R2
                - R3
                - R4
                - none
              description: Collection type
            canary_island_special_zone:
              type: string
              enum:
                - r1
                - r2
                - r3
                - none
              description: Canary Island special zone indicator. Required for Canary Island owners when all items have 0% VAT.
            account_number_and_swift_bic:
              type: string
              description: Bank account number and SWIFT/BIC code
        relationships:
          type: object
          properties:
            contact:
              $ref: '#/components/schemas/RelationshipLinkage'
            numeration:
              $ref: '#/components/schemas/RelationshipLinkage'
