              format: date
              description: |
                Date on which the operation took place (delivery of goods or provision of services). It is always on or before `issue_date`. Falls back to `issue_date` when no operation date has been set, so it is only `null` on drafts that have no `issue_date` yet. Only present when `kind` is `income` (omitted for expenses and additional incomes).
