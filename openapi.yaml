tags:
  - name: Authentication
    description: Obtaining OAuth2 access tokens via the Client Credentials Grant.
  - name: Users
    description: User account information
  - name: Contacts
    description: |
      Clients and suppliers.

      `name` is required for every contact.

      ## Country
      When `country_code` is omitted on create (`POST /contacts` and `POST /contacts/bulk`), it is deduced:

      - From the `tax_id` EU VAT prefix (e.g. `FR…` → `FR`, `EL…` → `GR`), or `ES` when the `tax_id` is a valid
        Spanish NIF/CIF/NIE (with or without the `ES` prefix). Only when `document_type` is `NIF` or not set.
      - Defaults to `ES` when no `tax_id` is sent, except for accounts under the OSS special regime.
      - Otherwise the request is rejected with `country_code` "can't be blank".

      A deduced `ES` country with an `ES`-prefixed Spanish `tax_id` (e.g. `ESB12345674`) is stored without the
      prefix (`B12345674`). A `country_code` sent explicitly is never changed.

      ## Tax ID rules (all accounts)
      `tax_id` is normalized before validation: spaces and punctuation are removed and it is uppercased
      (e.g. `b-12345674` is stored as `B12345674`).

      When the contact has both `tax_id` and `document_type` (the stored values are validated, so a PATCH that only
      changes `country_code` can also fail):

      - Spanish contacts (`country_code: ES` sent explicitly) cannot use a `tax_id` starting with `ES`.
      - `none` (not registered) requires `country_code: ES` and a valid Spanish NIF/CIF/NIE.

      ## Verifactu accounts
      On accounts with Verifactu activated, these extra rules apply:

      - `document_type` must be valid for the contact's `country_code`:
        - `ES`: `NIF`, `passport`, `none`
        - Other EU countries: `NIF`, `passport`, `official_id_from_residence_country`, `residence_permit`, `other`
        - Non-EU countries: `passport`, `official_id_from_residence_country`, `residence_permit`, `other`
      - When `document_type` is set, `tax_id` is validated against it:
        - Spanish contacts with `NIF` or `none`: a valid Spanish NIF/CIF/NIE of at most 9 characters.
        - Other EU contacts with `NIF`: must start with the country's VAT prefix (e.g. `FR…`, `EL…` for Greece).
        - Any other case: at most 20 characters, and a non-Spanish `tax_id` cannot contain only letters.
      - `tax_id` cannot be the account's own tax ID.
      - When an income document with this contact is finalized, `name` must be at most 120 characters (letters, digits,
        punctuation and spaces only), and:
        - Invoices: the contact must have `tax_id` and `document_type`.
        - Simplified invoices: the contact must either have `tax_id` and `document_type`, or have none of `tax_id`,
          `zip_code` and `document_type` (an anonymous recipient). Partial data is rejected.
  - name: Book Entries
    description: 'Read-only listing of all book entries. The type filter accepts: invoices, paysheets, tickets, additional_incomes.'
  - name: Invoices
    description: Full invoices (income and expenses)
  - name: Simplified Invoices
    description: Simplified invoices
  - name: Additional Incomes
    description: Additional income entries (simplified income documents). Always outbound (income). These entries are not subject to Verifactu.
  - name: Paysheets
    description: 'Employee paysheets. Note: For paysheets, issuing_* fields refer to the company (target) and recipient_* fields refer to the employee (origin), which is reversed from other book entry types.'
  - name: Numbering Series
    description: Invoice numbering series configuration
  - name: Accounting Categories
    description: Read-only accounting categories
  - name: Accounting Subcategories
    description: Accounting subcategories
  - name: Attachments
    description: File attachments for book entries
paths:
  /oauth/token:
    post:
      operationId: createAccessToken
      summary: Generate access token
      description: |
        Exchanges API credentials for a Bearer access token using the
        OAuth2 Client Credentials Grant. Use the resulting `access_token`
        as `Authorization: Bearer <access_token>` on all other requests.
      tags:
        - Authentication
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
                - scope
              properties:
                grant_type:
                  type: string
                  const: client_credentials
                  description: Must be `client_credentials` (REQUIRED).
                scope:
                  type: string
                  const: ecommerce
                  description: |
                    Must always be `ecommerce` (REQUIRED on every token request), even though scopes do not need to be configured manually in your app settings. Omitting it returns `400 invalid_scope`.
            example:
              grant_type: client_credentials
              scope: ecommerce
      responses:
        '200':
          description: Access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    const: Bearer
                  expires_in:
                    type: integer
                    example: 7200
                    description: Token lifetime in seconds.
                  scope:
                    type: string
                    example: ecommerce
                  created_at:
                    type: integer
                    description: Unix timestamp of issuance.
              example:
                access_token: abc123...
                token_type: Bearer
                expires_in: 7200
                scope: ecommerce
                created_at: 1719999999
        '400':
          description: |
            Invalid or missing scope/grant_type. Note: the response body's `status_code` field is always `401` regardless of this actual HTTP status code (see `OAuthErrorResponse`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
              example:
                error: invalid_scope
                error_description: The requested scope is invalid, unknown, or malformed.
                status_code: 401
        '401':
          description: Missing or invalid client credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
              example:
                error: invalid_client
                error_description: Client authentication failed.
                status_code: 401
  /users/{id}:
    get:
      operationId: getUser
      summary: Show user
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      responses:
        '200':
          description: User found
          content:
            application/vnd.quipu.v1+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserResource'
              example:
                data:
                  id: '42'
                  type: users
                  attributes:
                    email: user@example.com
                    name: Jane
                    surnames: Doe
                    locale: es
                    sign_up_draft_data: null
                    is_full_admin: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /{owner_slug}/contacts:
    get:
      operationId: listContacts
      summary: List contacts
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/OwnerSlug'
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: filter[kind]
          in: query
          schema:
            type: string
            enum:
              - client
              - supplier
              - employee
          description: Filter by contact kind
        - name: filter[tax_id]
          in: query
          schema:
            type: string
          description: Filter by tax ID
        - name: filter[country]
          in: query
          schema:
            type: string
          description: Filter by country code (comma-separated for multiple)
        - name: filter[email]
          in: query
          schema:
            type: string
          description: Filter by email address
        - name: filter[q]
          in: query
          schema:
            type: string
          description: Free-text search across contact fields
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - name
              - '-name'
              - total_paid_income
              - '-total_paid_income'
              - total_unpaid_income
              - '-total_unpaid_income'
              - total_paid_expenses
              - '-total_paid_expenses'
              - total_unpaid_expenses
              - '-total_unpaid_expenses'
          description: Sort field (prefix with `-` for descending)
      responses:
        '200':
          description: Paginated list of contacts
          content:
            application/vnd.quipu.v1+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContactResource'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createContact
      summary: Create contact
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/OwnerSlug'
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/vnd.quipu.v1+json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/ContactCreateWritable'
            example:
              data:
                type: contacts
                attributes:
                  name: Acme Corp
                  tax_id: B12345674
                  document_type: NIF
                  phone: +34 912 345 678
                  email: billing@acme.com
                  address: Calle Mayor 1
                  town: Madrid
                  zip_code: '28013'
                  country_code: ES
                  client_number: '124'
                  is_supplier_of_direct_goods: false
                  bank_account_number: ES9121000418450200051332
                  bank_account_swift_bic: CAIXESBBXXX
      responses:
        '201':
          description: Contact created
          content:
            application/vnd.quipu.v1+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContactResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /{owner_slug}/contacts/{id}:
    get:
      operationId: getContact
      summary: Show contact
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/OwnerSlug'
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Contact found
          content:
            application/vnd.quipu.v1+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContactResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateContact
      summary: Update contact
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/OwnerSlug'
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/ContentTypeHeader'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/vnd.quipu.v1+json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/ContactWritable'
      responses:
        '200':
          description: Contact updated
          content:
            application/vnd.quipu.v1+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContactResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteContact
      summary: Delete contact
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/OwnerSlug'
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Contact deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /{owner_slug}/book_entries:
    get:
      operationId: listBookEntries
      summary: List all book entries
      description: |
        Returns a paginated list of all book entries including invoices,
        tickets, simplified invoices, additional income, and paysheets.
      tags:
        - Book Entries
      parameters:
        - $ref: '#/components/parameters/OwnerSlug'
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IncludeBookEntry'
        - name: with_detailed_amounts
          in: query
          schema:
            type: boolean
          description: |
            Include the `detailed_amounts` breakdown object in each entry. Presence of the parameter is enough — any value (including empty) enables it.
        - name: filter[type]
          in: query
          schema:
            type: string
            enum:
              - invoices
              - tickets
              - paysheets
              - additional_incomes
          description: Filter by entry type
        - name: filter[kind]
          in: query
          schema:
            type: string
            enum:
              - expenses
              - income
          description: Filter by kind (expenses or income)
        - name: filter[q]
          in: query
          schema:
            type: string
          description: Free-text search
        - name: filter[period]
          in: query
          schema:
            type: string
          description: Filter by period (e.g. "2024Q1", "2024-01")
        - $ref: '#/components/parameters/FilterOperationDate'
        - $ref: '#/components/parameters/FilterOperationDateFrom'
        - $ref: '#/components/parameters/FilterOperationDateTo'
        - name: filter[payment_status]
          in: query
          schema:
            type: string
            enum:
              - paid
              - unpaid
              - due
              - pending
          description: 'Filter by payment status. Note: `unpaid` includes both `pending` and overdue entries.'
        - name: filter[contact_id]
          in: query
          schema:
            type: integer
          description: Filter by contact ID
        - name: filter[validation_status]
          in: query
          schema:
            type: string
          description: Filter by validation status
        - name: filter[field_query][field]
          in: query
          schema:
            type: string
          description: Field name for field-level query filter
        - name: filter[field_query][term]
          in: query
          schema:
            type: string
          description: Search term for field-level query filter
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - number
              - '-number'
              - issue_date
              - '-issue_date'
              - counterpart_name
              - '-counterpart_name'
              - total_amount
              - '-total_amount'
              - total_amount_without_taxes
              - '-total_amount_without_taxes'
          description: Sort field (prefix with `-` for descending)
      responses:
        '200':
          description: Paginated list of book entries
          content:
            application/vnd.quipu.v1+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookEntryResource'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  included:
                    type: array
                    description: |
                      Populated when `?include=` is used. Contains sideloaded resources shared across the whole collection (deduplicated) — e.g. `?include=items,accounting_category,accounting_subcategory` returns each book entry's own accounting category/subcategory plus each item's own, whenever it differs from the book entry's default.
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/ItemResource'
                        - $ref: '#/components/schemas/ContactResource'
                        - $ref: '#/components/schemas/AccountingCategoryResource'
                        - $ref: '#/components/schemas/AccountingSubcategoryResource'
                        - $ref: '#/components/schemas/InvoiceResource'
                        - $ref: '#/components/schemas/TicketResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /{owner_slug}/invoices:
    get:
      operationId: listInvoices
      summary: List invoices
      tags:
        - Invoices
      parameters:
        - $ref: '#/components/parameters/OwnerSlug'
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IncludeInvoice'
        - name: filter[kind]
          in: query
          schema:
            type: string
            enum:
              - expenses
              - income
          description: Filter by kind (expenses or income)
        - name: filter[q]
          in: query
          schema:
            type: string
          description: Free-text search
        - name: filter[period]
          in: query
          schema:
            type: string
          description: Filter by period (e.g. "2024Q1", "2024-01")
        - $ref: '#/components/parameters/FilterOperationDate'
        - $ref: '#/components/parameters/FilterOperationDateFrom'
        - $ref: '#/components/parameters/FilterOperationDateTo'
        - name: filter[payment_status]
          in: query
          schema:
            type: string
            enum:
              - paid
              - unpaid
              - due
              - pending
          description: 'Filter by payment status. Note: `unpaid` includes both `pending` and overdue entries.'
        - name: filter[validation_status]
          in: query
          schema:
            type: string
          description: Filter by validation status
        - name: filter[contact_id]
          in: query
          schema:
            type: integer
          description: Filter by contact ID
        - name: filter[field_query][field]
          in: query
          schema:
            type: string
          description: Field name for field-level query filter
        - name: filter[field_query][term]
          in: query
          schema:
            type: string
          description: Search term for field-level query filter
      responses:
        '200':
          description: Paginated list of invoices
          content:
            application/vnd.quipu.v1+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InvoiceResource'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  included:
                    type: array
                    description: Populated when `?include=` is used. Contains sideloaded resources.
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/ItemResource'
                        - $ref: '#/components/schemas/ContactResource'
                        - $ref: '#/components/schemas/AccountingCategoryResource'
                        - $ref: '#/components/schemas/AccountingSubcategoryResource'
                        - $ref: '#/components/schemas/InvoiceResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createInvoice
      summary: Create invoice
      tags:
        - Invoices
      parameters:
        - $ref: '#/components/parameters/OwnerSlug'
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/vnd.quipu.v1+json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/InvoiceCreateWritable'
            example:
              data:
                type: invoices
                attributes:
                  kind: income
                  issue_date: '2024-03-15'
                  operation_date: '2024-03-10'
                  paid_at: '2024-03-20'
                  payment_method: bank_transfer
                  tags: consulting
                  notes: March consulting services
                relationships:
                  contact:
                    data:
                      id: '101'
                      type: contacts
                  numeration:
                    data:
                      id: '5'
                      type: numbering_series
                  items:
                    data:
                      - type: book_entry_items
                        attributes:
                          concept: Consulting services
                          unitary_amount: '1500.00'
                          quantity: 1
                          vat_percent: 21
                          retention_percent: 15
      responses:
        '201':
          description: Invoice created
          content:
            application/vnd.quipu.v1+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/InvoiceResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /{owner_slug}/invoices/{id}:
    get:
      operationId: getInvoice
      summary: Show invoice
      tags:
        - Invoices
      parameters:
        - $ref: '#/components/parameters/OwnerSlug'
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IncludeInvoice'
      responses:
        '200':
          description: Invoice found
          content:
            application/vnd.quipu.v1+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/InvoiceResource'
                  included:
                    type: array
                    description: Populated when `?include=` is used. Contains sideloaded resources.
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/ItemResource'
                        - $ref: '#/components/schemas/ContactResource'
                        - $ref: '#/components/schemas/AccountingCategoryResource'
                        - $ref: '#/components/schemas/AccountingSubcategoryResource'
                        - $ref: '#/components/schemas/InvoiceResource'
              examples:
