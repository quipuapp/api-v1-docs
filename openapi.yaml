          type: string
          nullable: true
        recipient_country_code:
          type: string
          nullable: true
        accounting_account_code:
          type: string
          nullable: true
          description: >
            Full accounting ledger code for this document's main accounting category/subcategory.
        economic_activity_id:
          x-internal: true
          type: integer
          nullable: true
          description: >
            ID of the economic activity (epígrafe) associated with this document.
            (Aplifisa integration only.)
        document_type:
          x-internal: true
          type: string
          nullable: true
          description: |
            Verifactu document type code.

            - `F1` — Invoices and simplified invoices with name, country, type of tax id type and tax id number.
            - `F2` — Invoices and simplified invoices without NIF in the recipient (client) and missing the tax id type. Also, Additional Income entries always, regardless of whether the contact has a complete NIF or not. If the Additional Income is itself a credit note, the credit-note criteria below take precedence.
            - `R1` — Credit notes due to an error founded in law, misapplied VAT or other errors. Also the default for expense (purchase invoice) credit notes when no motive is selected.
            - `R2` — Credit notes due to a bad debt (customer does not pay). Customer does not pay after 6 months/year, company recovers VAT.
            - `R3` — Credit note due to customer's bankruptcy or insolvency.
            - `R4` — Rest of credit notes.
            - `R5` — Simplified invoices credit notes.
        contact_account_code:
          x-internal: true
          type: string
          nullable: true
          description: >
            Accounting ledger code for the counterpart contact on this document (client account for
            outbound documents, supplier account for inbound). Null when the document has no contact.
            (Aplifisa integration only.)
        account_breakdown:
          x-internal: true
          type: object
          nullable: true
          description: >
            Document total broken down by accounting account code, mirroring the account selection used
            for A3/Sage export (asset reclassification, non-deductible expense routing, disbursement
            accounts included). Always `null` for paysheets — breakdowns are only computed for invoices,
            tickets, simplified invoices and additional incomes. (Aplifisa integration only.)
          properties:
            base:
              type: object
              description: Map of accounting account code (string) to the amount booked to it (number).
              additionalProperties:
                type: number
        vat_breakdown:
          x-internal: true
          type: object
          nullable: true
          description: >
            Document's VAT groups keyed by VAT rate (e.g. "21", "10", "0"), each carrying its Verifactu
            fiscal classification. Always `null` for paysheets — breakdowns are only computed for
            invoices, tickets, simplified invoices and additional incomes. (Aplifisa integration only.)
          additionalProperties:
            type: object
            properties:
              tax:
                type: number
                description: Total VAT amount for this rate group.
              base:
                type: number
                description: Total taxable base for this rate group.
              operation_classification:
                type: string
                nullable: true
                enum: [S1, S2, N1, N2]
                description: |
                  Classification code

                  - `S1` — Subject and not exempt — no reverse charge (inversión del sujeto pasivo).
                  - `S2` — Subject and not exempt — with reverse charge.
                  - `N1` — Not subject — Articles 7, 14, or other.
                  - `N2` — Not subject — localization rules.
                  - `null` — Exempt — see `exempt_operation_type` for the specific exemption.
              exempt_operation_type:
                type: string
                nullable: true
                enum: [E1, E2, E3, E5, E6]
                description: |
                  Exemption code.

                  - `E1` — VAT-exempt owner operating with a Spanish contact, at 0% rate.
                  - `E2` — 0%-rated operation with a non-EU contact.
                  - `E3` — Intracommunity supply of goods (not services) to an EU contact with a valid VAT-IVA number.
                  - `E5` — Explicit exemption reason set by the user in the "Imported by" field (e.g. diplomats, universities — see exempt_reason r1/r2/r3).
                  - `E6` — Exemption with no more specific reason determined.
                  - `null` — A classification code is present for this rate (mutually exclusive with `operation_classification`).
              regime_key:
                type: string
                nullable: true
                description: |
                  Regime key code.

                  - `01` — General VAT regime.
                  - `02` — Export.
                  - `08` — IPSI / IGIC.
                  - `10` — Collections by third parties.
                  - `11` — Business leases — VAT subject and not exempt.
                  - `17` — OSS and IOSS.
                  - `18` — Equivalence surcharge regime.
                  - `19` — Agricultural regime.
                  - `20` — Simplified regime.
                  - `null` — Not determined (group has no current items).
              equalization_rate:
                type: number
                nullable: true
                description: Equivalence surcharge rate for this VAT group. Null when no item in the group has a surcharge.
              equalization_amount:
                type: number
                description: Total equivalence surcharge amount for this VAT group. 0 when none.
        rectification_type:
          x-internal: true
          type: string
          nullable: true
          enum: [S, I]
          description: >
            For credit notes: `S` (full substitution — same absolute total as the countered document) or
            `I` (by differences). Null for non-credit-note documents. (Aplifisa integration only.)
        rectification_kind:
          x-internal: true
          type: string
          nullable: true
          enum: [R1, R2, R3, R4, R5]
          description: >
            For credit notes: `R1`–`R5`, matching `document_type`. Null for non-credit-note documents.
            (Aplifisa integration only.)
        operation_description:
          x-internal: true
          type: string
          description: >
            Human-readable summary of the document's current-kind line items, formatted as
            "account - concept - amount€" per item and joined with " | ", truncated to 500 characters.
            Falls back to "Operación" when there are no current-kind items. (Aplifisa integration only.)
        retention_rates:
          x-internal: true
          type: array
          description: >
            Retention breakdown across this document's line items, grouped by retention rate.
            (Aplifisa integration only.)
          items:
            type: object
            properties:
              rate:
                type: number
                description: Retention percentage (e.g. 15.0).
              amount:
                type: number
                description: Total amount withheld at this rate across the document's items.
        detailed_amounts:
          type: object
          description: >
            Breakdown of the document's totals into accounting/tax components. Only present
            when the `with_detailed_amounts` query parameter is sent (any value, including
            empty, enables it).
          properties:
            user_amount_without_taxes:
              type: string
            user_vat_amount:
              type: string
            user_equalization_tax_amount:
              type: string
            user_income_tax_amount:
              type: string
            user_total_amount:
              type: string
            expense_amount:
              type: string
            non_deductible_expense_amount:
              type: string
            income_amount:
              type: string
            input_vat_amount:
              type: string
            non_deductible_input_vat_amount:
              type: string
            non_deductible_assets_vat_amount:
              type: string
            non_computable_input_vat_amount:
              type: string
            output_vat_amount:
              type: string
            input_equalization_tax_amount:
              type: string
            output_equalization_tax_amount:
              type: string
            income_tax_withheld_amount:
