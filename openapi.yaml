# ═════════════════════════════════════════════════════════════════════════
# Components
# ═════════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2
      description: >
        OAuth2 Bearer token. Obtain it via `POST /oauth/token` (see the
        Authentication tag / `## Authentication` section above).
    basicAuth:
      type: http
      scheme: basic
      description: >
        HTTP Basic Auth with your API `client_id`/`client_secret`. Used only
        to request an access token via `POST /oauth/token`.

  # ── Parameters ─────────────────────────────────────────────────────────
  parameters:
    OwnerSlug:
      name: owner_slug
      in: path
      required: true
      schema:
        type: string
      description: URL slug of the account/business owner
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Resource ID
    AcceptHeader:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        const: application/vnd.quipu.v1+json
      description: Required API version accept header
    ContentTypeHeader:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
        const: application/vnd.quipu.v1+json
      description: Required content type for write operations
    PageNumber:
      name: page[number]
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-indexed)
    PageSize:
      name: page[size]
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Number of results per page
    IncludeBookEntry:
      name: include
      in: query
      schema:
        type: string
      description: |
        Comma-separated list of related resources to embed in the `included`
        array (JSON:API sideloading). Allowed values: `items`, `contact`,
        `accounting_category`, `accounting_subcategory`.
        Example: `?include=items,contact`.
      x-internal-description: |
        Comma-separated list of related resources to embed in the `included`
        array (JSON:API sideloading). Allowed values: `items`, `contact`,
        `accounting_category`, `accounting_subcategory`, `economic_activity`.
        Example: `?include=items,contact`.
    IncludeInvoice:
      name: include
      in: query
      schema:
        type: string
      description: |
        Comma-separated list of related resources to embed in the `included`
        array (JSON:API sideloading). Allowed values: `items`, `contact`,
        `accounting_category`, `accounting_subcategory`.
        Example: `?include=items,contact`.
      x-internal-description: |
        Comma-separated list of related resources to embed in the `included`
        array (JSON:API sideloading). Allowed values: `items`, `contact`,
        `accounting_category`, `accounting_subcategory`, `liquidations`, `economic_activity`.
        Example: `?include=items,contact`.
    IncludeSimplifiedInvoice:
      name: include
      in: query
      schema:
        type: string
      description: |
        Comma-separated list of related resources to embed in the `included`
        array. Allowed values: `items`, `accounting_category`,
        `accounting_subcategory`, `attachments`. Example: `?include=items`.
      x-internal-description: |
        Comma-separated list of related resources to embed in the `included`
        array. Allowed values: `items`, `accounting_category`,
        `accounting_subcategory`, `attachments`, `liquidations`, `economic_activity`. Example: `?include=items`.
    IncludeAdditionalIncome:
      name: include
      in: query
      schema:
        type: string
      description: |
        Comma-separated list of related resources to embed in the `included`
        array. Allowed values: `items`, `accounting_category`,
        `accounting_subcategory`, `attachments`. Example: `?include=items`.
      x-internal-description: |
        Comma-separated list of related resources to embed in the `included`
        array. Allowed values: `items`, `accounting_category`,
        `accounting_subcategory`, `attachments`, `liquidations`, `economic_activity`. Example: `?include=items`.
    IncludePaysheet:
      name: include
      in: query
      schema:
        type: string
      description: |
        Comma-separated list of related resources to embed in the `included`
        array. Allowed values: `contact`, `accounting_category`,
        `accounting_subcategory`, `attachments`.
        Example: `?include=contact,accounting_subcategory`.
      x-internal-description: |
        Comma-separated list of related resources to embed in the `included`
        array. Allowed values: `contact`, `accounting_category`,
        `accounting_subcategory`, `attachments`, `liquidations`, `economic_activity`.
        Example: `?include=contact,accounting_subcategory`.

  # ── Shared Schemas ─────────────────────────────────────────────────────
  schemas:
    # ── Pagination ───────────────────────────────────────────────────────
    PaginationMeta:
      type: object
      properties:
        pagination_info:
          type: object
          properties:
            total_pages:
              type: integer
              example: 2
            current_page:
              type: integer
              example: 1
            total_results:
              type: integer
              example: 23

    # ── JSON API Relationship Link ───────────────────────────────────────
    RelationshipLinkage:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
      nullable: true

    RelationshipLinkageArray:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string

    # ── Error ────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              source:
                type: object
                properties:
                  pointer:
                    type: string
                    example: /data/attributes/name
              detail:
                type: string
                example: can't be blank

    # ── OAuth Error (POST /oauth/token) ──────────────────────────────────
    OAuthErrorResponse:
      type: object
      description: >
        Error shape returned by `POST /oauth/token`. Unlike the rest of the
        API, this does NOT follow the JSON:API `ErrorResponse` format.
      properties:
        error:
          type: string
          example: invalid_scope
        error_description:
          type: string
        status_code:
          type: integer
          description: >
            Always 401 due to a custom error handler, even when the actual
            HTTP status code returned is different (e.g. 400 for
            invalid_scope).

    # ── Item (nested resource) ───────────────────────────────────────────
    ItemResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: items
        attributes:
          $ref: "#/components/schemas/ItemAttributes"

    ItemAttributes:
      type: object
      description: Line item on an invoice, ticket, or simplified invoice
      properties:
        id:
          type: string
        concept:
          type: string
          description: Name / description of the line item
        unitary_amount:
          type: string
          description: Unit price as decimal string
        quantity:
          type: number
          description: Quantity
        kind:
          type: string
          description: Item kind
        vat_amount:
          type: string
          description: Calculated VAT amount
        retention_amount:
          type: string
          description: Calculated retention amount
        discount_amount:
          type: string
          description: Calculated discount amount
        deductible_vat_amount:
          type: string
          description: Deductible VAT amount
        total_amount:
          type: string
          description: Total amount for this line item
        description:
          type: string
          description: Extended description
        discount_percent:
          type: number
          description: Discount percentage
        vat_percent:
          type: number
          description: VAT percentage
        retention_percent:
          type: number
          description: Retention percentage
        deductible_vat_percent:
          type: number
          description: Deductible VAT percentage
        deductible_expense_percent:
          type: number
          description: Deductible expense percentage
        counterpart_account_code:
          x-internal: true
          type: string
          nullable: true
          description: >
            Accounting ledger code for this line item's category/subcategory (Aplifisa integration only —
            present only when the owner has Aplifisa activated).
        isp:
          x-internal: true
          type: boolean
          description: >
            Whether reverse charge (Inversión del Sujeto Pasivo) applies to this line item — always `false`
            for outbound documents. (Aplifisa integration only.)
        retention_key:
          x-internal: true
          type: string
          nullable: true
          description: >
            IRPF retention key code configured in the owner's preferences for this item's retention percentage
            (e.g. "01" for professional activities). Null when the item has no retention.
            (Aplifisa integration only.)
        model_190_key:
          x-internal: true
          type: string
          nullable: true
          description: >
            Modelo 190 key for this item's retention, looked up by year and retention percentage. Null when the
            item has no retention. (Aplifisa integration only.)
        model_190_subkey:
          x-internal: true
          type: string
          nullable: true
          description: >
            Modelo 190 subkey paired with `model_190_key`. Null when the item has no retention.
            (Aplifisa integration only.)
        tax_form:
          x-internal: true
          type: string
          nullable: true
          enum: ["00", "01", "02", "03", "05", "09", "11"]
          description: >
            IRPF/VAT reporting form code for this line item: `00` (non-EU import), `01` (standard),
            `02` (EU goods), `03` (transport), `05` (other services), `09` (1% retention professional),
            `11` (EU services). Null for tickets and disbursement items. (Aplifisa integration only.)
        equalization_tax_rate:
          x-internal: true
          type: number
          nullable: true
          description: >
            Equivalence surcharge (recargo de equivalencia) rate matching this item's VAT rate
            (e.g. 5.2 for 21% VAT, 1.4 for 10% VAT). Null when the item has no surcharge.
            (Aplifisa integration only.)
        equalization_tax_amount:
          x-internal: true
          type: string
          description: >
            Equivalence surcharge amount for this line item. "0.0" when none applies.
            (Aplifisa integration only.)
        retention_rate:
          x-internal: true
          type: number
          description: >
            Retention percentage for this line item (e.g. 21, 15, 7). 0 when no retention applies.
            (Aplifisa integration only.)

    ItemWritableAttributes:
      type: object
      properties:
        concept:
          type: string
        unitary_amount:
          type: string
        quantity:
          type: number
        vat_percent:
          type: number
        retention_percent:
          type: number
        discount_percent:
          type: number
        kind:
          type: string
        description:
          type: string

    # ── Users ────────────────────────────────────────────────────────────
    UserResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: users
        attributes:
          type: object
          properties:
            email:
              type: string
              format: email
            name:
              type: string
            surnames:
              type: string
            locale:
              type: string
              example: es
            sign_up_draft_data:
              type: object
              nullable: true
            is_full_admin:
              type: boolean
            accepted_commercial_communication:
              type: boolean
              description: Whether the user has opted in to receive commercial communications.

    # ── Contacts ─────────────────────────────────────────────────────────
    ContactAttributes:
      type: object
      properties:
        name:
          type: string
        tax_id:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        town:
          type: string
        zip_code:
          type: string
        country_code:
          type: string
          example: ES
        total_paid_incomes:
          type: string
        total_unpaid_incomes:
          type: string
        total_incomes:
          type: string
        total_paid_expenses:
          type: string
        total_unpaid_expenses:
          type: string
        total_expenses:
          type: string
        client_number:
          type: string
          nullable: true
        supplier_number:
          type: string
          nullable: true
        document_type:
          type: string
          nullable: true
        is_client:
          type: boolean
        is_supplier:
          type: boolean
        is_supplier_of_direct_goods:
          type: boolean
        bank_account_number:
          type: string
          nullable: true
        bank_account_swift_bic:
          type: string
          nullable: true
        deletable:
          type: boolean
          description: |
            Whether the current API caller has permission to delete this contact.
            Computed per-request from the caller's abilities (not a persistent flag);
            typically `true` when the contact has no associated book entries and the
            caller can destroy it.
        account_code:
          type: string
          nullable: true
          description: >
            Accounting ledger code assigned to this contact (client or supplier account,
            depending on context).

    ContactResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: contacts
        attributes:
          $ref: "#/components/schemas/ContactAttributes"

    ContactWritable:
      type: object
      required: [type, attributes]
      properties:
        type:
          type: string
          const: contacts
        attributes:
          type: object
          properties:
            name:
              type: string
            tax_id:
              type: string
            phone:
              type: string
            email:
              type: string
              format: email
            address:
              type: string
            town:
              type: string
            zip_code:
              type: string
            country_code:
              type: string
            client_number:
              type: string
            supplier_number:
              type: string
            employee_number:
              type: string
            a3_nom_id:
              type: string
            is_supplier_of_direct_goods:
              type: boolean
            description:
              type: string
            bank_account_number:
              type: string
            bank_account_swift_bic:
              type: string
            document_type:
              type: string
            pdf_language:
              type: string
              description: Language used when rendering PDF documents for this contact.
            incomes_due_date:
              type: string
              description: Default due-date preference applied to income documents issued to this contact.
            incomes_payment_method:
              type: string
              description: Default payment method applied to income documents issued to this contact.
            equivalence_subcharge:
              type: boolean
              description: Whether equivalence surcharge applies by default for this contact.
            expenses_payment_method:
              type: string
              description: Default payment method applied to expense documents received from this contact.
            expenses_due_date:
              type: string
              description: Default due-date preference applied to expense documents received from this contact.
            contact_analytic_value_ids:
              type: string
              description: Comma-separated list of analytic value IDs to associate with the contact (e.g. "12,34").
        relationships:
          type: object
          properties:
            expense_category:
              $ref: "#/components/schemas/RelationshipLinkage"
              description: Default accounting category applied to expense documents for this contact.
            expense_subcategory:
              $ref: "#/components/schemas/RelationshipLinkage"
              description: Default accounting subcategory applied to expense documents for this contact.
            income_category:
              $ref: "#/components/schemas/RelationshipLinkage"
              description: Default accounting category applied to income documents for this contact.
            income_subcategory:
              $ref: "#/components/schemas/RelationshipLinkage"
              description: Default accounting subcategory applied to income documents for this contact.

    ContactBulkItem:
      x-internal: true
      type: object
      required: [attributes]
      properties:
        attributes:
          type: object
          required: [tax_id]
          description: >
            Same fields as `ContactWritable.attributes` (see `POST /contacts`), plus the four
            accounting-number sync fields below. `tax_id` is required for every item.
          properties:
            name:
              type: string
            tax_id:
              type: string
            phone:
              type: string
            email:
              type: string
              format: email
            address:
              type: string
            town:
              type: string
            zip_code:
              type: string
            country_code:
              type: string
            client_number:
              type: string
            supplier_number:
              type: string
            employee_number:
              type: string
            a3_nom_id:
              type: string
            is_supplier_of_direct_goods:
              type: boolean
            description:
              type: string
            bank_account_number:
              type: string
            bank_account_swift_bic:
              type: string
            client_accounting_number:
              type: string
              example: "43000124"
              description: >
                Full accounting account code for this contact's own client account (group 4).
                Derives `client_number` from it; the prefix must match one of the owner's valid
                client-account prefixes for their country and its length must equal the owner's
                `accounting_digits_number`.
            supplier_accounting_number:
              type: string
              example: "40000124"
              description: >
                Full accounting account code for this contact's own supplier account (group 4).
                Derives `supplier_number` (and `is_supplier_of_direct_goods`) from it; same
                prefix/length rules as `client_accounting_number`.
            income_accounting_number:
              type: string
              example: "70500124"
              description: >
                Full accounting account code for this contact's income counterpart account
                (group 7). Resolves and sets the `income_category`/`income_subcategory`
