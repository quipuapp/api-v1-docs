components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2
      description: |
        OAuth2 Bearer token. Obtain it via `POST /oauth/token` (see the Authentication tag / `## Authentication` section above).
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic Auth with your API `client_id`/`client_secret`. Used only to request an access token via `POST /oauth/token`.
  parameters:
    OwnerSlug:
      name: owner_slug
      in: path
      required: true
      schema:
        type: string
      description: URL slug of the account/business owner
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Resource ID
    AcceptHeader:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        const: application/vnd.quipu.v1+json
      description: Required API version accept header
    ContentTypeHeader:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
        const: application/vnd.quipu.v1+json
      description: Required content type for write operations
    PageNumber:
      name: page[number]
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-indexed)
    PageSize:
      name: page[size]
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Number of results per page
    FilterOperationDate:
      name: filter[operation_date]
      in: query
      schema:
        type: string
      description: |
        Filter income documents by `operation_date`. Accepts a whole year (`2024` or, equivalently, `2024-all`), a quarter (`2024-Q1`), a month (`2024-3`, without a leading zero) or `all` (any date, i.e. no restriction). For an explicit range, send `filter[operation_date][from]` and `filter[operation_date][to]` instead. Documents without an operation date are matched by their `issue_date`, and drafts that have no `issue_date` yet are always included, as are additional incomes (operation date does not apply to them). Only applied together with `filter[kind]=income`; ignored otherwise.
    FilterOperationDateFrom:
      name: filter[operation_date][from]
      in: query
      schema:
        type: string
        format: date
      description: |
        Start of an explicit `operation_date` range (inclusive). Must be sent together with `filter[operation_date][to]`; follows the same rules as `filter[operation_date]`.
    FilterOperationDateTo:
      name: filter[operation_date][to]
      in: query
      schema:
        type: string
        format: date
      description: |
        End of an explicit `operation_date` range (inclusive). Must be sent together with `filter[operation_date][from]`; follows the same rules as `filter[operation_date]`.
    IncludeBookEntry:
      name: include
      in: query
      schema:
        type: string
      description: |
        Comma-separated list of related resources to embed in the `included`
        array (JSON:API sideloading). Allowed values: `items`, `contact`,
        `accounting_category`, `accounting_subcategory`, `items.accounting_category`,
        `items.accounting_subcategory`.
        Example: `?include=items,contact`.

        When both `items` and `accounting_category`/`accounting_subcategory`
        are requested together, each item's own accounting category/subcategory
        is also embedded in `included` whenever it differs from the book
        entry's own default — no separate include value needed. The explicit
        nested form (`?include=items.accounting_category`, `?include=items.accounting_subcategory`)
        is also accepted for clients that prefer to request it directly.
    IncludeInvoice:
      name: include
      in: query
      schema:
        type: string
      description: |
        Comma-separated list of related resources to embed in the `included`
        array (JSON:API sideloading). Allowed values: `items`, `contact`,
        `accounting_category`, `accounting_subcategory`, `items.accounting_category`,
        `items.accounting_subcategory`.
        Example: `?include=items,contact`.

        When both `items` and `accounting_category`/`accounting_subcategory`
        are requested together, each item's own accounting category/subcategory
        is also embedded in `included` whenever it differs from the invoice's
        own default — no separate include value needed. The explicit nested
        form (`?include=items.accounting_category`, `?include=items.accounting_subcategory`) is
        also accepted for clients that prefer to request it directly.
    IncludeSimplifiedInvoice:
      name: include
      in: query
      schema:
        type: string
      description: |
        Comma-separated list of related resources to embed in the `included`
        array. Allowed values: `items`, `accounting_category`,
        `accounting_subcategory`, `items.accounting_category`,
        `items.accounting_subcategory`. Example: `?include=items`.

        When both `items` and `accounting_category`/`accounting_subcategory`
        are requested together, each item's own accounting category/subcategory
        is also embedded in `included` whenever it differs from the document's
        own default — no separate include value needed. The explicit nested
        form (`?include=items.accounting_category`, `?include=items.accounting_subcategory`) is
        also accepted for clients that prefer to request it directly.
    IncludeAdditionalIncome:
      name: include
      in: query
      schema:
        type: string
      description: |
        Comma-separated list of related resources to embed in the `included`
        array. Allowed values: `items`, `accounting_category`,
        `accounting_subcategory`, `items.accounting_category`,
        `items.accounting_subcategory`. Example: `?include=items`.

        When both `items` and `accounting_category`/`accounting_subcategory`
        are requested together, each item's own accounting category/subcategory
        is also embedded in `included` whenever it differs from the document's
        own default — no separate include value needed. The explicit nested
        form (`?include=items.accounting_category`, `?include=items.accounting_subcategory`) is
        also accepted for clients that prefer to request it directly.
    IncludePaysheet:
      name: include
      in: query
      schema:
        type: string
      description: |
        Comma-separated list of related resources to embed in the `included`
        array. Allowed values: `contact`, `accounting_category`,
        `accounting_subcategory`.
        Example: `?include=contact,accounting_subcategory`.
  schemas:
    PaginationMeta:
      type: object
      properties:
        pagination_info:
          type: object
          properties:
            total_pages:
              type: integer
              example: 2
            current_page:
              type: integer
              example: 1
            total_results:
              type: integer
              example: 23
    RelationshipLinkage:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
      nullable: true
    RelationshipLinkageArray:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              source:
                type: object
                properties:
                  pointer:
                    type: string
                    example: /data/attributes/name
              detail:
                type: string
                example: can't be blank
    OAuthErrorResponse:
      type: object
      description: |
        Error shape returned by `POST /oauth/token`. Unlike the rest of the API, this does NOT follow the JSON:API `ErrorResponse` format.
      properties:
        error:
          type: string
          example: invalid_scope
        error_description:
          type: string
        status_code:
          type: integer
          description: |
            Always 401 due to a custom error handler, even when the actual HTTP status code returned is different (e.g. 400 for invalid_scope).
    ItemResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: book_entry_items
        attributes:
          $ref: '#/components/schemas/ItemAttributes'
        relationships:
          type: object
          properties:
            accounting_category:
              $ref: '#/components/schemas/RelationshipLinkage'
            accounting_subcategory:
              $ref: '#/components/schemas/RelationshipLinkage'
    ItemAttributes:
      type: object
      description: Line item on an invoice, ticket, or simplified invoice
      properties:
        concept:
          type: string
          description: Name / description of the line item
        unitary_amount:
          type: string
          description: Unit price as decimal string
        quantity:
          type: string
          description: Quantity as decimal string
        kind:
          type: string
          description: Item kind
        vat_amount:
          type: string
          description: Calculated VAT amount
        retention_amount:
          type: string
          description: Calculated retention amount
        discount_amount:
          type: string
          description: Calculated discount amount
        deductible_vat_amount:
          type: string
          description: Deductible VAT amount
        total_amount:
          type: string
          description: Total amount for this line item
        description:
          type: string
          description: Extended description
        discount_percent:
          type: string
          description: Discount percentage as decimal string
        vat_percent:
          type: string
          description: VAT percentage as decimal string
        retention_percent:
          type: string
          description: Retention percentage as decimal string
        deductible_vat_percent:
          type: string
          description: Deductible VAT percentage as decimal string
        deductible_expense_percent:
          type: string
