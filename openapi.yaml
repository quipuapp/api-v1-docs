            accounting_subcategory:
              $ref: "#/components/schemas/RelationshipLinkage"
            economic_activity:
              $ref: "#/components/schemas/RelationshipLinkage"
              x-internal: true
              description: Sets the entry's economic activity (Aplifisa integration only.)
            items:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        const: items
                      attributes:
                        $ref: "#/components/schemas/ItemWritableAttributes"

    # ── Paysheets ────────────────────────────────────────────────────────
    PaysheetAttributes:
      allOf:
        - $ref: "#/components/schemas/BookEntryAttributes"
        - type: object
          properties:
            kind:
              type: string
              enum: [expenses]
              description: Paysheets are always inbound documents, so `kind` is always `expenses`.
            net_pay:
              type: string
            gross_pay:
              type: string
            employee_ss_amount:
              type: string
            employee_retention:
              type: string
            company_ss_amount:
              type: string
            retention_amount:
              type: string

    PaysheetResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: paysheets
        attributes:
          $ref: "#/components/schemas/PaysheetAttributes"
        relationships:
          type: object
          properties:
            contact:
              $ref: "#/components/schemas/RelationshipLinkage"
            accounting_category:
              $ref: "#/components/schemas/RelationshipLinkage"
            accounting_subcategory:
              $ref: "#/components/schemas/RelationshipLinkage"
            liquidations:
              x-internal: true
              allOf:
                - $ref: "#/components/schemas/RelationshipLinkageArray"
              description: Money entries/book entries reconciled against this paysheet. (Aplifisa integration only.)

    PaysheetWritable:
      type: object
      required: [type, attributes]
      properties:
        type:
          type: string
          const: paysheets
        attributes:
          type: object
          required: [kind, issue_date]
          properties:
            kind:
              type: string
              enum: [expenses]
              description: Paysheets are always inbound documents, so `kind` is always `expenses`.
            issue_date:
              type: string
              format: date
            paid_at:
              type: string
              format: date
              nullable: true
            payment_method:
              type: string
            tags:
              type: string
              description: Comma-separated list of tag names (e.g. "vip client,important").
            net_pay:
              type: number
              description: Net pay amount
            employee_ss_amount:
              type: number
              description: Employee social security amount
            employee_retention:
              type: number
              description: Employee retention amount
            company_ss_amount:
              type: number
              description: Company social security amount
            account_number_and_swift_bic:
              type: string
              description: Bank account number and SWIFT/BIC code
        relationships:
          type: object
          properties:
            contact:
              $ref: "#/components/schemas/RelationshipLinkage"
              description: The employee (required).
            numeration:
              $ref: "#/components/schemas/RelationshipLinkage"
            accounting_subcategory:
              $ref: "#/components/schemas/RelationshipLinkage"
            project:
              $ref: "#/components/schemas/RelationshipLinkage"
            book_entry_draft:
              $ref: "#/components/schemas/RelationshipLinkage"
            attachments:
              $ref: "#/components/schemas/RelationshipLinkageArray"
            economic_activity:
              $ref: "#/components/schemas/RelationshipLinkage"
              x-internal: true
              description: Sets the entry's economic activity (Aplifisa integration only.)
            liquidations:
              $ref: "#/components/schemas/RelationshipLinkageArray"
              x-internal: true
              description: Links the entry to existing liquidations (Aplifisa integration only.)
            items:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        const: items
                      attributes:
                        $ref: "#/components/schemas/ItemWritableAttributes"

    # ── Numbering Series ─────────────────────────────────────────────────
    NumberingSeriesAttributes:
      type: object
      properties:
        prefix:
          type: string
          example: "F-"
        default:
          type: boolean
        amending:
          type: boolean
        deletable:
          type: boolean
        applicable_to:
          type: string
          nullable: true
        is_valid:
          type: boolean
        applies_to:
          type: string
          enum: [new_documents, existing_documents]
          nullable: true

    NumberingSeriesResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: numbering_series
        attributes:
          $ref: "#/components/schemas/NumberingSeriesAttributes"

    NumberingSeriesCreateWritable:
      type: object
      required: [type, attributes]
      properties:
        type:
          type: string
          const: numbering_series
        attributes:
          type: object
          required: [prefix]
          properties:
            prefix:
              type: string
              description: Series prefix, unique per owner. Cannot be changed after creation.
            applicable_to:
              type: string
              enum: [invoices, tickets, simplified_invoices, additional_incomes, paysheets]
              description: Restricts the series to a specific document type. Stored internally as `identifier` (singularized).
            default:
              type: boolean
            amending:
              type: boolean
              description: Whether this series is used for amending (counter) documents.
            applies_to:
              type: string
              enum: [new_documents, existing_documents]

    NumberingSeriesUpdateWritable:
      type: object
      required: [type, attributes]
      properties:
        type:
          type: string
          const: numbering_series
        attributes:
          type: object
          properties:
            applicable_to:
              type: string
              enum: [invoices, tickets, simplified_invoices, additional_incomes, paysheets]
            default:
              type: boolean
            amending:
              type: boolean
            applies_to:
              type: string
              enum: [new_documents, existing_documents]

    # ── Accounting Categories ────────────────────────────────────────────
    AccountingCategoryAttributes:
      type: object
      properties:
        name:
          type: string
        prefix:
          type: integer
        kind:
          type: string
        accounting_digits_number:
          type: integer
          nullable: true
          description: >
            Number of digits used in this owner's chart-of-accounts codes (e.g. 8).
        active:
          x-internal: true
          type: boolean
          description: >
            Whether this category is one of the owner's active accounts. Set via
            `PATCH .../accounting_categories/{id}/activate`, or automatically for the
            owner's default categories after an initial bulk sync.
            (Aplifisa integration only.)

    AccountingCategoryResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: accounting_categories
        attributes:
          $ref: "#/components/schemas/AccountingCategoryAttributes"

    # ── Accounting Subcategories ─────────────────────────────────────────
    AccountingSubcategoryAttributes:
      type: object
      properties:
        name:
          type: string
        suffix:
          type: string

    AccountingSubcategoryResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: accounting_subcategories
        attributes:
          $ref: "#/components/schemas/AccountingSubcategoryAttributes"
        relationships:
          type: object
          properties:
            accounting_category:
              $ref: "#/components/schemas/RelationshipLinkage"

    AccountingSubcategoryWritable:
      type: object
      required: [type, attributes]
      properties:
        type:
          type: string
          const: accounting_subcategories
        attributes:
          type: object
          properties:
            name:
              type: string
              example: "Office Supplies"
            suffix:
              type: string
              example: "01"
        relationships:
          type: object
          properties:
            accounting_category:
              $ref: "#/components/schemas/RelationshipLinkage"

    AccountingSubcategoryUpdateWritable:
      type: object
      required: [type, attributes]
      properties:
        type:
          type: string
          const: accounting_subcategories
        attributes:
          type: object
          properties:
            name:
              type: string
              example: "Office Supplies"
            suffix:
              type: string
              example: "01"

    AccountingSubcategoryBulkItem:
      x-internal: true
      type: object
      required: [attributes]
      properties:
        attributes:
          type: object
          required: [account]
          properties:
            account:
              type: string
              example: "70501"
              description: >
                Full accounting account code. Its prefix must match an existing accounting
                category for this owner.
            description:
              type: string
              example: Ventas de mercaderías

    AccountingSubcategoryBulkResultItem:
      x-internal: true
      type: object
      properties:
        account:
          type: string
        id:
          type: string
          nullable: true
          description: Present when the item succeeded.
        status:
          type: string
          enum: [created, updated, skipped, error]
        errors:
          type: array
          items:
            type: string
          description: Present only when `status` is `error`.

    # ── Attachments ──────────────────────────────────────────────────────
    AttachmentResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: attachments
        attributes:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: URL to the original file.
            small_url:
              type: string
              format: uri
              description: URL to the preview-sized version of the file.
            thumbnail_url:
              type: string
              format: uri
              description: URL to the thumbnail-sized version of the file.
        relationships:
          type: object
          properties:
            book_entry:
              $ref: "#/components/schemas/RelationshipLinkage"

    # ── Liquidations / Money Accounts / Money Entries (internal — Aplifisa integration only) ──
    LiquidationResource:
      x-internal: true
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: liquidations
        attributes:
          type: object
          properties:
            amount:
              type: string
            money_entry_id:
              type: integer
              nullable: true
            book_entry_id:
              type: integer
              nullable: true
            kind:
              type: string
              enum: [charge, payment]
              description: >
                Money movement direction: "charge" (cobro) or "payment" (pago). Based on the
                money entry's amount sign when present, otherwise on the settled document's
                direction — the same convention used by the A3/Sage accounting exports.
            date:
              type: string
              format: date
              nullable: true
            book_entry_number:
              type: string
              nullable: true
            money_account_accounting_number:
              type: string
              nullable: true
            book_entry_counterpart_accounting_number:
              type: string
              nullable: true

    MoneyAccountResource:
      x-internal: true
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: money_accounts
        attributes:
          type: object
          properties:
            name:
              type: string
            accounting_number:
              type: string
              nullable: true
            currency:
              type: string
              const: eur

    MoneyEntryResource:
      x-internal: true
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: money_entries
        attributes:
          type: object
          properties:
            concept:
              type: string
              nullable: true
            amount:
              type: string
            transaction_date:
              type: string
              format: date
              nullable: true
            status:
              type: string
            money_account_id:
              type: integer
              nullable: true
            money_account_accounting_number:
              type: string
              nullable: true
            accounting_category_id:
              type: integer
              nullable: true
              description: Present when this money entry is reconciled directly against an accounting category (no book entry involved).
            accounting_category_prefix:
              type: integer
              nullable: true
              description: The linked accounting category's `prefix` (its accounting number).
            linked_money_entry_id:
              type: integer
              nullable: true
              description: Present when this money entry is one side of an account-to-account transfer. Points at the counterpart money entry.
            linked_money_account_accounting_number:
              type: string
              nullable: true
              description: The counterpart money entry's money account accounting number, when `linked_money_entry_id` is present.

    EconomicActivityResource:
      x-internal: true
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: economic_activities
        attributes:
          type: object
          properties:
            name:
              type: string
            section:
              type: integer
              enum: [1, 2, 3]
              description: 1 = Empresarial, 2 = Profesional, 3 = Artística.
            epigraph:
              type: string
              description: "Three digits, optionally followed by a dot and one more digit (e.g. \"751\", \"751.1\")."
            default:
              type: boolean
              description: Whether this is the owner's default economic activity.

  # ── Responses ──────────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/vnd.quipu.v1+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            errors:
              - detail: Not authorized
    NotFound:
      description: Resource not found
      content:
        application/vnd.quipu.v1+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            errors:
              - detail: Record not found
    UnprocessableEntity:
      description: Validation errors
      content:
        application/vnd.quipu.v1+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            errors:
              - source:
                  pointer: /data/attributes/name
                detail: can't be blank
    Forbidden:
      description: Authenticated but not authorized to perform this action
      content:
        application/vnd.quipu.v1+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            errors:
              - detail: You are not authorized to access this resource
    BadRequest:
      description: Malformed request (e.g. invalid parameter value)
      content:
        application/vnd.quipu.v1+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            errors:
              - detail: Bad request
    TooManyRequests:
      description: Rate limit exceeded (5 requests per 5 seconds)
      content:
        application/vnd.quipu.v1+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            errors:
              - detail: Rate limit exceeded. Maximum 5 requests per 5 seconds.
